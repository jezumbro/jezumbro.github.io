name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    env:
      PROD: true
    runs-on: ubuntu-24.04
    steps:
      - name: git-checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: install
        run: npm ci

      - name: lint & style
        run: npm run format:ci

      - name: astro-build
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
